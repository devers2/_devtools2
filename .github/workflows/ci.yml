name: DevTools2 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 워크플로 토큰은 읽기 전용으로 (기본값은 저장소 설정에 따라 쓰기 권한일 수 있음 — 설치 중 받는 제3자 코드도 이 토큰을 봄)
permissions:
  contents: read

jobs:
  # ── 1. 정적 구문 분석 및 인코딩/BOM 검사 ─────────────────────────────────
  static-analysis:
    name: Static Analysis & Script Parsing
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (태그 대신 커밋 고정)

      - name: BOM & Line Ending Inspection
        shell: pwsh
        run: |
          Write-Host "=== UTF-8 BOM 및 인코딩 검사 ==="
          $bomFiles = @()
          Get-ChildItem -Recurse -File -Include *.sh, *.bash, *.ps1, *.json, *.toml, *.conf | ForEach-Object {
              $bytes = Get-Content -Path $_.FullName -AsByteStream -TotalCount 3 -ErrorAction SilentlyContinue
              if ($bytes -and $bytes.Count -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
                  $bomFiles += $_.FullName
              }
          }
          if ($bomFiles.Count -gt 0) {
              Write-Error "UTF-8 BOM이 포함된 파일 발견:`n$($bomFiles -join "`n")"
              exit 1
          }
          Write-Host "✓ 모든 스크립트 및 설정 파일이 UTF-8 NoBOM 입니다."

      - name: PowerShell 7 Syntax & ScriptBlock Parse Test
        shell: pwsh
        run: |
          Write-Host "=== PowerShell 7 구문 파싱 검사 ==="
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
              try {
                  $null = [scriptblock]::Create((Get-Content $_.FullName -Raw))
                  $errors = $null
                  $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
                  if ($errors.Count -gt 0) {
                      Write-Error "[$($_.Name)] Parser 에러 발견: $($errors | Out-String)"
                      $failed = $true
                  } else {
                      Write-Host "  ✓ $($_.Name) 파싱 통과"
                  }
              } catch {
                  Write-Error "[$($_.Name)] ScriptBlock 파싱 실패: $_"
                  $failed = $true
              }
          }
          if ($failed) { exit 1 }

      # ⚠️ 이 단계(shell: powershell)의 run 본문에는 ASCII 문자만 사용하십시오.
      # 러너가 이 본문을 BOM 없는 임시 .ps1 로 저장하고 Windows PowerShell 5.1 이 이를 cp1252 로 읽어서,
      # 한글 UTF-8 바이트(0x93/0x94)가 스마트 따옴표(“ ”)로 해석되어 문자열이 깨집니다(파싱 에러로 단계 실패).
      - name: Windows PowerShell 5.1 Parse Test
        shell: powershell
        run: |
          Write-Host "=== Windows PowerShell 5.1 parse check ==="
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
              try {
                  $code = [System.IO.File]::ReadAllText($_.FullName, [System.Text.Encoding]::UTF8)
                  $null = [scriptblock]::Create($code)
                  $errors = $null
                  $null = [System.Management.Automation.Language.Parser]::ParseInput($code, $_.FullName, [ref]$null, [ref]$errors)
                  if ($errors.Count -gt 0) {
                      Write-Error "[$($_.Name)] PS 5.1 parser error: $($errors | Out-String)"
                      $failed = $true
                  } else {
                      Write-Host "  OK $($_.Name) (PS 5.1 parse)"
                  }
              } catch {
                  Write-Error "[$($_.Name)] PS 5.1 ScriptBlock parse failed: $_"
                  $failed = $true
              }
          }
          if ($failed) { exit 1 }

      - name: Run Full Automated Test Suite (run-all-tests.ps1)
        shell: pwsh
        run: |
          ./tests/run-all-tests.ps1

  # ── 2. Bash 스크립트 구문 검사 (bash -n & ShellCheck) ──────────────────────
  bash-lint:
    name: Bash Syntax & ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (태그 대신 커밋 고정)

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # 검사 대상: 추적 중인 *.sh·*.bash + 확장자 없이 bash shebang 으로 시작하는 파일
      #   (예전에는 확장자만 봐서 scripts/format/format · scripts/java/jdtls · scripts/git-hooks/pre-commit 이 빠졌음)
      - name: Collect Bash Files
        run: |
          git ls-files -z | while IFS= read -r -d '' f; do
              case "$f" in
                  *.sh|*.bash) echo "$f" ;;
                  *) [ -f "$f" ] && head -n1 "$f" | grep -qE '^#!.*\b(bash|sh)\b' && echo "$f" ;;
              esac
          done | sort -u > "$RUNNER_TEMP/bash-files.txt"
          echo "검사 대상 $(wc -l < "$RUNNER_TEMP/bash-files.txt")개"

      - name: Bash -n Syntax Check
        run: |
          echo "=== bash -n 구문 검증 ==="
          failed=0
          while IFS= read -r file; do
              bash -n "$file" || { echo "❌ 구문 오류: $file"; failed=1; }
          done < "$RUNNER_TEMP/bash-files.txt"
          exit $failed

      # error 등급(예: set -e 스크립트의 함수 밖 local → 그 줄에서 즉시 종료)은 CI 를 실패시키고,
      # warning 등급은 기존 경고가 남아 있어 보고만 합니다.
      # 확장자가 없는 fzf 도구(bw-lib, bw-server-manager, command-palette)도 함께 검사합니다.
      - name: Run ShellCheck
        run: |
          echo "=== ShellCheck 정적 분석 (error 는 실패, warning 은 보고) ==="
          failed=0
          warn_total=0
          while IFS= read -r file; do
              shellcheck -s bash -S error -e SC1090,SC1091 "$file" || { echo "❌ ShellCheck error: $file"; failed=1; }
              n=$(shellcheck -s bash -S warning -e SC1090,SC1091 -f gcc "$file" | wc -l)
              [ "$n" -gt 0 ] && echo "⚠️  ShellCheck warning ${n}건: $file"
              warn_total=$((warn_total + n))
          done < "$RUNNER_TEMP/bash-files.txt"
          echo "warning 합계: ${warn_total}건 (보고만 함 — 줄여 나갈 기준선)"
          exit $failed

      # 로컬 규칙(AGENTS.md)과 같은 통합 테스트를 CI 에서도 돌립니다(예전에는 Windows 의 run-all-tests.ps1 만 실행).
      #   pwsh 는 GitHub 의 Ubuntu 러너에 기본 설치되어 PS 파서 검사도 실행되고, Windows PowerShell 5.1 전용 검사는 SKIP 으로 표시됩니다.
      - name: Run Full Automated Test Suite (run-all-tests.sh)
        run: bash tests/run-all-tests.sh

  # ── 3. Ubuntu 24.04 컨테이너 무인 설치 및 doctor 검증 ──────────────────────
  container-install-test:
    name: Ubuntu 24.04 Clean Container Install & Doctor Test
    runs-on: ubuntu-24.04
    # 무인 설치가 질문에서 멈추면 기본 6시간을 기다리므로 상한을 둡니다
    timeout-minutes: 90
    container:
      image: ubuntu:24.04
    steps:
      - name: Install Minimal Bootstrap Packages
        run: |
          apt-get update && apt-get install -y sudo curl git ca-certificates

      - name: Create Test User with sudo
        run: |
          useradd -m -s /bin/bash tester
          echo "tester ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/tester
          chmod 0440 /etc/sudoers.d/tester

      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (태그 대신 커밋 고정)
        with:
          path: repo

      # 토큰은 run 본문에 직접 끼우지 않고 env 로 받아 su 의 --whitelist-environment 로만 넘깁니다
      #   (예전 "export GITHUB_TOKEN=${{ github.token }}" 는 토큰이 su -c 인자 문자열에 평문으로 들어갔음).
      - name: Run Full Unattended Installation (DT2_NONINTERACTIVE=1)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chown -R tester:tester /__w/
          su --whitelist-environment=GITHUB_TOKEN - tester -c "
            export DT2_NONINTERACTIVE=1
            # 버전은 tool-versions.toml [track] 정책을 따릅니다(예전 DT2_VERSION_MODE 는 제거됨).
            # 버전 목록 조회(GitHub API) 호출 한도를 완화하기 위해 워크플로 토큰을 넘깁니다(위 env → whitelist).
            export DT2_DUPLICATE_MODE=skip
            export DT2_ORCA_CHOICE=n
            export DT2_VSCODE_CHOICE=n
            export DT2_ZED_CHOICE=n
            export DT2_REF=${{ github.sha }}
            bash /__w/_devtools2/_devtools2/repo/scripts/linux/setup-devtools2.sh
          "

      - name: Execute Doctor Verification Script
        run: |
          su - tester -c "
            export DEVTOOLS2=/var/opt/_devtools2
            bash /var/opt/_devtools2/scripts/linux/dev-env/doctor.sh
          "
