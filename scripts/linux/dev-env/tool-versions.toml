# DevTools2 도구 버전 이력 (tool-versions.toml)
#
# 형상관리: 이 파일은 설치 스크립트와 함께 Git으로 관리됩니다.
#
# ─── 규칙 ────────────────────────────────────────────────────────────────────
#  • [track] 섹션이 모든 도구의 "버전 정책"입니다 (아래 [track] 주석 참고). 버전을 올리거나 고정하거나
#    되돌리는 방법은 모든 도구가 같습니다: [track] 의 값 한 줄을 바꾸고 설치 스크립트를 다시 실행합니다.
#  • 각 배열의 첫 번째 항목은 버전 목록 조회(GitHub/Adoptium/Node.js/Gradle API)에 실패했을 때 쓰는
#    폴백 버전이며, 나머지 항목은 이전 버전 이력(되돌릴 때 참고)입니다.
#    (예전 "최신/지정/개별" 선택 방식에서는 첫 항목이 "최종 설치 버전"(기본 설치 버전)이었지만,
#     지금은 [track] 범위 안의 최신 버전이 설치 대상이라 첫 항목은 폴백 용도로만 쓰입니다)
#  • 설치에 성공하면 그 버전이 이 PC 의 설치 기록(data/state/installed-tools.json)에 남고, 다음 실행 때
#    폴백 버전으로 이 파일의 첫 항목보다 우선합니다. 이 파일 자체는 자동으로 바뀌지 않습니다(Git 작업 트리 보호).
#  • 롤백: 문제가 생긴 버전이 있으면 [track] 값을 이전 전체 버전(예: "0.63.1")으로 바꿔 고정한 뒤
#    설치 스크립트를 다시 실행합니다. (예전처럼 배열에서 항목을 지우는 것만으로는 되돌아가지 않습니다)
#  • 이미 설치된 도구는 새 버전이 있을 때만 업데이트 여부를 묻습니다. 같은 버전을 다시 설치(깨진 설치 복구)하려면
#    DT2_DUPLICATE_MODE=reinstall 로 설치 스크립트를 실행합니다.
#
# ─── 예시 ─────────────────────────────────────────────────────────────────────
#  nodejs = ["v24.16.0", "v24.15.0"]
#  → 버전 목록 조회에 실패하고 이 PC 의 설치 기록도 없으면 "v24.16.0"(첫 번째 항목)이 설치됩니다.
#
# ─── 사용법: 여러 버전을 함께 두는 도구(JDK·Python)에 새 버전 추가·제거 ──────────────────────
#  JDK 와 Python 은 버전마다 폴더를 따로 두고(jdk-25, python-315) 전환해 씁니다. 설치 대상 목록은
#  이 파일의 [core_tools] 키(jdkNN / python3NN)에서 자동으로 읽으므로, 키만 추가하면 아래가 모두 따라옵니다.
#    ● 설치 스크립트(2.install-core-tools.sh)의 설치·상태 표
#    ● 명령 팔레트(scripts/fzf/command-palette)의 JDK / Python 전환 메뉴
#    ● 전환 스크립트(scripts/linux/cmd/jdk_switch.sh · py_switch.sh) — 설치된 폴더 기준이라 수정 불필요
#
#  [JDK 29 추가]  (Adoptium LTS 메이저)
#    1) [core_tools] 에   jdk29 = ["29.0.1+9"]      ← 버전 목록 조회 실패 시 쓸 폴백 버전 (Adoptium 표기)
#    2) [track] 에        jdk29 = "29"              ← 생략하면 메이저("29") 안 최신 패치가 기본값
#    3) 설치 스크립트 실행 → modules/java/jdk-29 설치,   전환: source jdk_switch.sh 29
#
#  [Python 3.16 추가]
#    1) [core_tools] 에   python316 = ["3.16.0+20271020"]   ← "CPython 버전+빌드 날짜"(python-build-standalone 릴리스 태그)
#                         (값은 https://github.com/astral-sh/python-build-standalone/releases 의 파일 이름
#                          cpython-3.16.0+20271020-... 에서 확인. 폴백 전용이라 최신이 아니어도 됨)
#    2) [track] 에        python316 = "3.16"        ← 생략하면 마이너("3.16") 안 최신 패치가 기본값
#    3) 설치 스크립트 실행 → modules/python/python-316 설치,   전환: source py_switch.sh 316
#
#  [버전 제거]  키 두 줄을 지우면 이후 설치·메뉴 대상에서 빠집니다. 이미 설치된 폴더는 지우지 않으니
#              필요 없으면 modules/java/jdk-NN 또는 modules/python/python-3NN 을 직접 삭제하세요.
#  ⚠️ 기본 버전(새 셸의 JAVA_HOME·PYTHON_HOME)은 키 순서와 무관합니다 — 전환 스크립트(또는 팔레트)로 고릅니다.
# ──────────────────────────────────────────────────────────────────────────────

# ──────────────────────────────────────────────────────────────────────────────
# 버전 범위(track) — 모든 도구 공통 버전 정책 (_install-utils.sh 의 resolve_track_version)
# ──────────────────────────────────────────────────────────────────────────────
#  "latest"  → 항상 최신 (메이저 포함)          예: 앱·하위 호환이 좋은 도구
#  "24"      → 메이저 24 안에서 최신 패치        예: Node.js·JDK (메이저는 빌드·패키지 호환과 맞물림)
#  "0.12"    → 0.12.x 안에서 최신                예: Neovim(마이너가 플러그인 호환과 맞물림)·fzf
#  "0.45.0"  → 정확히 이 버전으로 고정          예: 규칙 문법이 자주 바뀌는 도구
#  설치 스크립트는 범위 안의 최신 버전을 찾아 설치된 버전과 다르면 업데이트 여부를 묻고(기본 Y, 무인 실행은 유지),
#  범위 밖에 새 버전이 있으면 안내만 합니다. 메이저를 올리려면 값만 바꾸면 됩니다(예: nodejs = "26").
[track]
# 2.install-core-tools.sh
nodejs = "24"          # Node.js LTS 메이저 (track "latest" 도 Current 가 아닌 최신 LTS)
jdk8 = "8"
jdk17 = "17"
jdk21 = "21"
jdk25 = "25"
gradle = "latest"      # 프로젝트는 각자 Gradle wrapper 를 쓰므로 전역 Gradle 은 최신(새 프로젝트·wrapper 생성용)
neovim = "0.12"        # 마이너(0.13)는 플러그인 호환 확인 후 올림
python315 = "3.15"     # 2026-10 출시 최신 마이너 (설치만, 기본 PYTHON_HOME 은 3.14 유지 — 패키지 지원이 따라오면 전환)
python314 = "3.14"     # Python 은 "3.14" 가 사실상 메이저(매년 기능 릴리스) → 패치만. 새 마이너는 새 키·새 폴더로 추가
python312 = "3.12"     # 정확히 고정하려면 빌드 날짜까지: "3.12.13+20260414"
ghostty = "latest"     # Linux 데스크톱 기본 터미널 앱
# 3.install-cli-tools.sh
fzf = "0.74"           # 커맨드 팔레트·셸 단축키가 옵션/출력 형식에 의존 → 패치만
ripgrep = "15.2"       # Neovim 검색 도구 기반 → 패치만
fd = "10.4"            # 〃
ast_grep = "0.45.0"    # 마이너마다 규칙 문법이 바뀌는 경우가 있어 고정
lazygit = "latest"     # 독립 TUI 앱
rclone = "latest"      # SFTP 마운트 — 보안·버그 수정 중요, 설정 형식 하위 호환
bitwarden = "latest"   # 오래된 bw 는 서버 변경으로 로그인이 깨질 수 있음 (x86_64·ARM64 공통)
gh = "latest"          # 하위 호환이 좋고 에이전트가 최신 기능을 가정
delta = "latest"       # diff 표시 도구 — 출력만 담당, 없거나 실패하면 lazygit·git 이 일반 diff 로 폴백
difftastic = "latest"  # 구조 기준 diff — 〃
win32yank = "0.1.1"    # 원본 프로젝트 업데이트 없음 (WSL2 전용)

# ──────────────────────────────────────────────────────────────────────────────
# 2.install-core-tools.sh 관리 도구
# ──────────────────────────────────────────────────────────────────────────────
[core_tools]

# Node.js LTS (v24.x) — 버전은 'v' 포함 (예: "v24.15.0")
nodejs = ["v24.18.0", "v24.15.0"]

# Adoptium Eclipse Temurin JDK 버전 (Adoptium API 연동 및 고정 버전)
jdk8 = ["8u504-b01", "8u482-b08"]
jdk17 = ["17.0.20.1+1", "17.0.18+8"]
jdk21 = ["21.0.12.1+1", "21.0.10+7"]
jdk25 = ["25.0.4.1+1", "25.0.2+10"]

# Gradle 포터블 빌드 도구
gradle = ["9.7.1", "9.4.1"]

# Python 포터블 빌드 (astral-sh/python-build-standalone) — "CPython 버전+빌드 날짜(릴리스 태그)"
# 이 프로젝트는 릴리스 태그가 빌드 날짜라 버전만으로는 다운로드 주소를 만들 수 없어 둘을 함께 기록합니다.
# (키를 추가하면 설치 스크립트·명령 팔레트 Python 전환 목록에 자동 반영 — get_supported_python_minors)
python315 = ["3.15.2+20261026"]
python314 = ["3.14.4+20260414"]
python312 = ["3.12.13+20260414"]

# Neovim (에디터)
neovim = ["v0.12.5", "v0.10.4"]

# Ghostty Terminal AppImage (pkgforge-dev 빌드) — 버전은 'v' 미포함 (예: "1.3.1")
ghostty = ["1.3.1"]

# ──────────────────────────────────────────────────────────────────────────────
# 3.install-cli-tools.sh 관리 도구
# ──────────────────────────────────────────────────────────────────────────────
[cli_tools]

# fzf (터미널 퍼지 파인더) — 버전은 'v' 미포함 (예: "0.71.0")
fzf = ["0.74.1", "0.71.0"]

# lazygit (TUI Git 클라이언트) — 버전은 'v' 미포함 (예: "0.61.1")
lazygit = ["0.63.1", "0.61.1"]

# ripgrep / rg (초고속 코드 검색) — 버전은 'v' 미포함 (예: "15.1.0")
ripgrep = ["15.2.0", "15.1.0"]

# fd-find / fd (초고속 파일 검색) — 버전은 'v' 미포함 (예: "10.4.2")
fd = ["10.4.2"]

# ast-grep / sg (AST 기반 코드 검색) — 버전은 'v' 미포함 (예: "0.45.0")
ast_grep = ["0.45.0", "0.44.1"]

# Bitwarden CLI / bw — x86_64·ARM64 공통 (형식: "YYYY.M.P", 예: "2026.9.0")
# (예전에는 ARM64 만 버전 관리(bitwarden_arm)하고 x86_64 는 공식 "항상 최신" 직접 다운로드 URL 을 썼으나,
#  [track] 정책으로 고정·되돌리기를 똑같이 적용하기 위해 두 아키텍처 모두 GitHub 릴리스 버전별 파일을 씁니다)
bitwarden = ["2026.10.0", "2026.9.0", "2026.8.0"]

# win32yank (WSL2 클립보드 연동, WSL2 전용) — 버전은 'v' 미포함 (예: "0.1.1")
win32yank = ["0.1.1"]

# rclone (클라우드 스토리지 동기화 도구) — 버전은 'v' 미포함 (예: "1.69.1")
rclone = ["1.69.1"]

# GitHub CLI / gh (PR·이슈·Actions — Claude Code·Codex·Antigravity·Orca 등 모든 에이전트와 터미널 공용)
# 버전은 'v' 미포함 (예: "2.103.3")
# ⚠️ gh 는 [track] gh = "latest"(항상 최신)입니다. 하위 호환이 잘 유지되고 에이전트가 최신 gh 기능을 가정하기 때문입니다.
#    이 값은 최신 버전 조회에 실패했을 때만 설치 버전으로 쓰입니다.
gh = ["2.103.3"]

# delta (git diff 표시 도구 — lazygit pager · git core.pager) — 버전은 'v' 미포함
delta = ["0.20.1"]

# difftastic / difft (구조 기준 diff — lazygit '|' 전환 · git dft) — 버전은 'v' 미포함
difftastic = ["0.71.0"]
