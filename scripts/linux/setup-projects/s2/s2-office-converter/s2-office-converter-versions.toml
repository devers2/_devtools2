"h2orestart@0.8.0" = "f36c19fa6b7dff1cf34114d926bdc088e6bcfa7fdc93d67eaafd3f572be1d62c"
"h2orestart@0.7.14" = "cbea23bc37861361bbc534bc0675e5bc67b36f712072490f82a9bf410d7c04d8"
# @rhwp/core 패키지 (https://www.npmjs.com/package/@rhwp/core) — npm integrity (sha512, base64)
"rhwp@0.8.7" = "sha512-qgNpY9aclCvy9D7cPnpuplu42kUFZCCPhdjAS5HBso4Z4XeHG3uchYdUleQBoas/zEuwfJ7H4/ulepqdL/LXDA=="
"rhwp@0.8.6" = "sha512-ZMO2QMHbR4v7t86feMWiRJ4QozjjqHDGv4PyzTT4LyMuX1LeUpmQaOHrGLQpbYMJV0IWCYjVRewKqkXx+w16XQ=="
