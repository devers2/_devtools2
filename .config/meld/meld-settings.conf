# ==============================================================================
# DevTools2 Meld 3-Way 병합 도구 전역 설정 (Meld Preferences)
# Neovim 규격(11.5pt, D2Coding ligature) 및 공식 다크 테마(meld-dark) 적용
# ==============================================================================
[org.gnome.meld]
style-scheme='meld-dark'
use-custom-font=true
custom-font='D2Coding ligature 11.5'
indent-width=2
tab-width=2
show-line-numbers=true
wrap-mode='none'
